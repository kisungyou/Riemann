name: JOSS draft PDF

on:
  push:
    paths:
      - 'paper/**'
      - '.github/workflows/draft-pdf.yml'
  pull_request:
    paths:
      - 'paper/**'
      - '.github/workflows/draft-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the JOSS draft
        uses: openjournals/openjournals-draft-action@af22ceb4b8f9eff6b3a13c05747ccc2f573cf2e6
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload the draft PDF
        uses: actions/upload-artifact@v7
        with:
          name: riemann-joss-draft
          path: paper/paper.pdf
          if-no-files-found: error
          archive: false
