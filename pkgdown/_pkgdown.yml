# themes:  https://bootswatch.com/ {flatly, united}
# icons:   https://fontawesome.com/
# pkgdown: https://pkgdown.r-lib.org/reference/index.html
# search:  https://docsearch.algolia.com/
#     docsearch:
#     api_key:
#      indexname: Riemann

url: https://www.kisungyou.com/Riemann/

destination: docs

authors:
  Kisung You:
    href: https://kisungyou.com

template:
  bootstrap: 5
  # Legacy Rd equations contain TeX delimiters that require client rendering.
  math-rendering: mathjax
  bslib:
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
  params:
    bootswatch: flatly
    ganalytics: UA-163713603-1

home:
  strip_header: false

news:
  cran_dates: false

navbar:
  title: "Riemann"
  left:
    - text: "Tutorials"
      href: articles/index.html
    - text: "Functions"
      href: reference/index.html
    - text: "News"
      href: news/index.html
    - text: "Other Packages"
      menu:
        - text: "(CRAN) RiemBase"
          href: https://CRAN.R-project.org/package=RiemBase
        - text : -----------------------------
        - text: "Rdimtools"
          href: https://kisungyou.com/Rdimtools/
        - text: "T4cluster"
          href: https://kisungyou.com/T4cluster/
        - text: "T4transport"
          href: https://kisungyou.com/T4transport/
  right:
    - icon: fa-twitter
      href: https://twitter.com/kisung_you
      aria-label: "Kisung You on Twitter"
    - icon: fa-github
      href: https://github.com/kisungyou/Riemann
      aria-label: "Riemann on GitHub"
    - icon: fa-envelope
      href: https://www.kisungyou.com/Riemann/#contact
      aria-label: "Contact the maintainer"

reference:
  - title: "Geometry, Fitted Models, and Validation"
    contents:
      - Riemann-package
      - riem.geometry
      - riem.reconstruct
      - riem-inspect
      - m2skreg-methods
      - riem-method-contracts
  - title: "Prepare Data on Manifolds"
    contents:
      - starts_with("wrap.")
  - title: "Shared Workflows (Consult Geometry and Method Contracts)"
  - subtitle: "[1] Basic Operations"
    contents:
      - has_concept("basic")
  - subtitle: "[2] Statistical Inference"
    contents:
      - has_concept("inference")
  - subtitle: "[3] Clustering"
    contents:
      - has_concept("clustering")
  - subtitle: "[4] Visualization and Dimension Reduction"
    contents:
      - has_concept("visualization")
  - subtitle: "[5] Curves"
    contents:
      - has_concept("curve")
  - subtitle: "[6] Other Methods"
    contents:
      - has_concept("learning")
  - title: "Functions on Specific Manifolds"
  - subtitle: "1) Sphere"
    contents:
      - has_concept("sphere")
  - subtitle: "2) Stiefel"
    contents:
      - starts_with("stiefel.")
  - subtitle: "3) Grassmann"
    contents:
      - starts_with("grassmann.")
  - subtitle: "4) SPD"
    contents:
      - has_concept("spd")
  - title: "Probability Distributions"
    contents:
      - has_concept("distribution")
  - title: "Data"
    contents:
      - has_concept("data")
  - title: "Others"
    contents:
      - has_concept("utility")
